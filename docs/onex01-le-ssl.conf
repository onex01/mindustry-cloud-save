<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName onex01.ru
	ServerAlias onex01.ru 95.31.205.15 www.onex01.ru
	ServerAdmin one@onex01.ru
	DocumentRoot /var/www/onex01/main

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# Settings directory
	<Directory /var/www/onex01/main>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
	
	# MIME types
	AddType application/javascript .js
	AddType text/css .css
	AddType image/svg+xml .svg

	# Proxy для Mindustry Cloud Save API
	ProxyPreserveHost On
	ProxyPass /api/ http://localhost:3000/api/
	ProxyPassReverse /api/ http://localhost:3000/api/

	# Лимит загрузки файлов (100MB)
	LimitRequestBody 104857600

SSLCertificateFile /etc/letsencrypt/live/onex01.ru/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/onex01.ru/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
