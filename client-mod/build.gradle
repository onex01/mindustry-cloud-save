plugins {
    id 'java'
}

group = 'com.onex01'
version = '1.0.0'

repositories {
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
    maven { url 'https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository' }
}

ext {
    mindustryVersion = 'v145'
}

configurations { d8 }

dependencies {
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"
    d8 'com.android.tools:r8:8.2.33'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar.enabled = false

task universalJar(dependsOn: compileJava) {
    outputs.file file("build/libs/cloud-save-mod.jar")
    
    doLast {
        mkdir("build/tmp")
        
        ant.jar(destfile: file("build/tmp/dex-classes.jar")) {
            fileset(dir: file("build/classes/java/main"))
        }
        
        def cmd = [
            'java', '-cp', configurations.d8.asPath,
            'com.android.tools.r8.D8',
            '--output', file("build/tmp").absolutePath,
            file("build/tmp/dex-classes.jar").absolutePath
        ]
        def proc = new ProcessBuilder(cmd)
            .directory(projectDir)
            .redirectErrorStream(true)
            .start()
        def output = proc.inputStream.text
        def exitCode = proc.waitFor()
        if (exitCode != 0) {
            throw new GradleException("D8 failed (exit ${exitCode}): ${output}")
        }
        
        def jarFile = file("build/libs/cloud-save-mod.jar")
        def zos = new java.util.zip.ZipOutputStream(new FileOutputStream(jarFile))
        
        file("build/classes/java/main").eachFileRecurse { f ->
            if (f.isFile()) {
                def entryName = file("build/classes/java/main").toPath()
                    .relativize(f.toPath()).toString().replace('\\', '/')
                zos.putNextEntry(new java.util.zip.ZipEntry(entryName))
                zos.write(f.bytes)
                zos.closeEntry()
            }
        }
        
        zos.putNextEntry(new java.util.zip.ZipEntry("classes.dex"))
        zos.write(file("build/tmp/classes.dex").bytes)
        zos.closeEntry()
        
        zos.putNextEntry(new java.util.zip.ZipEntry("mod.hjson"))
        zos.write(rootProject.file("mod.hjson").bytes)
        zos.closeEntry()
        
        file("bundles").eachFileRecurse { f ->
            if (f.isFile()) {
                def entryName = projectDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                zos.putNextEntry(new java.util.zip.ZipEntry(entryName))
                zos.write(f.bytes)
                zos.closeEntry()
            }
        }
        
        zos.close()
        
        file("build/tmp/dex-classes.jar").delete()
        file("build/tmp/classes.dex").delete()
        file("build/tmp").deleteDir()
        
        println "Universal JAR: ${jarFile.absolutePath}"
    }
}
